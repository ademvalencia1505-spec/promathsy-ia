<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1426">
<title>∑ MATES | Aprende matemáticas</title>
<style>
:root{
  --bg1:#071326; --bg2:#121c2c; --bg3:#273342;
  --panel:rgba(20,31,47,.88); --panel2:rgba(32,46,64,.88);
  --line:rgba(190,207,226,.17); --text:#f3f6fb; --muted:#aab7c8;
  --blue:#60a5fa; --blue2:#2563eb; --cyan:#67e8f9;
  --green:#4ade80; --red:#f87171;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 52%,var(--bg3) 100%);
  background-attachment:fixed;
}
.top-progress{
  position:sticky; top:0; z-index:20; padding:12px 5vw 13px;
  background:rgba(7,19,38,.94); border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.progress-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 8px;max-width:1100px}
.progress-label{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#cbd5e1}
.progress-number{font-size:13px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.track{height:9px;max-width:1100px;margin:auto;background:#344256;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#2563eb,#38bdf8,#67e8f9);transition:width .35s ease}
header{text-align:center;padding:34px 16px 12px}
.logo{font-size:clamp(34px,6vw,54px);font-weight:950;letter-spacing:-2px;margin:0;background:linear-gradient(90deg,#fff,#93c5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:8px 0 0;color:var(--muted);font-size:15px}
main{width:min(1050px,92vw);margin:20px auto 60px}
.screen{animation:appear .28s ease}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);margin:0 0 10px}
h1{font-size:clamp(29px,5vw,43px);line-height:1.12;margin:0 0 12px;letter-spacing:-1.2px}
.subtitle{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 27px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}
.card{
  position:relative;text-align:left;color:var(--text);cursor:pointer;
  border:1px solid var(--line);border-radius:19px;padding:24px;
  background:linear-gradient(145deg,rgba(34,49,69,.96),rgba(16,28,44,.96));
  box-shadow:0 12px 30px rgba(0,0,0,.15);transition:transform .18s,border-color .18s,background .18s;
}
.card:hover{transform:translateY(-4px);border-color:rgba(96,165,250,.75);background:linear-gradient(145deg,rgba(42,65,91,.98),rgba(18,34,54,.98))}
.card:focus-visible,button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.stage-card{min-height:220px;display:flex;flex-direction:column;justify-content:space-between}
.stage-card .symbol{font-size:43px;margin-bottom:24px}
.stage-card h2{font-size:27px;margin:0 0 8px}
.stage-card p{color:var(--muted);margin:0;line-height:1.5}
.course-card{min-height:125px;display:flex;align-items:center;gap:17px}
.course-number{width:58px;height:58px;flex:0 0 58px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#0e7490);font-weight:900;font-size:21px}
.card h3{margin:0 0 6px;font-size:19px}.card small{color:var(--muted);font-size:13px}
.topic-card{min-height:110px}.topic-icon{font-size:25px;display:block;margin-bottom:12px}.topic-card h3{font-size:17px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 24px}
.crumb{color:#bfdbfe;font-size:13px;font-weight:700}
.back-btn,.secondary-btn,.primary-btn{
  border:1px solid var(--line);border-radius:12px;padding:11px 16px;
  font-weight:800;font-size:14px;cursor:pointer;transition:.18s;
}
.back-btn,.secondary-btn{color:#e2e8f0;background:rgba(42,55,73,.75)}
.back-btn:hover,.secondary-btn:hover{border-color:var(--blue);background:#273b55}
.primary-btn{background:linear-gradient(100deg,#2563eb,#0e7490);color:white;border:0;padding:13px 20px}
.primary-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.lesson-panel,.quiz-panel,.result-panel{
  border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,32px);
  background:linear-gradient(145deg,rgba(29,43,61,.97),rgba(14,25,40,.97));
  box-shadow:0 15px 35px rgba(0,0,0,.18);margin-bottom:18px;
}
.lesson-panel h2,.quiz-panel h2{margin:0 0 14px;font-size:25px}
.lesson-text{color:#d8e1ed;line-height:1.8;font-size:16px}
.lesson-text ul{padding-left:22px}
.formula{margin:18px 0;padding:17px;border:1px solid rgba(103,232,249,.22);border-radius:13px;background:rgba(8,47,73,.36);font-size:19px;font-weight:800;text-align:center;color:#e0f2fe}
.quiz-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.question-count{font-size:13px;color:var(--cyan);font-weight:850;letter-spacing:.6px}
.daily-badge{display:inline-block;margin-left:8px;padding:5px 9px;border:1px solid rgba(103,232,249,.24);border-radius:999px;background:rgba(8,47,73,.42);font-size:11px;color:#cffafe;letter-spacing:0}
.loading-ai{display:flex;align-items:center;gap:12px;color:#dbeafe}.loading-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 6px rgba(103,232,249,.12);animation:pulse 1.1s infinite alternate}@keyframes pulse{to{opacity:.35;transform:scale(.8)}}
.error-note{color:#fecaca;line-height:1.6}
.question{font-size:21px;line-height:1.45;font-weight:800;margin:8px 0 20px}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.answer{
  padding:15px;border-radius:12px;border:1px solid var(--line);background:#26364b;
  color:var(--text);font-weight:750;font-size:16px;cursor:pointer;text-align:left;
}
.answer:hover{border-color:var(--blue);background:#304763}
.answer.selected{border:2px solid var(--cyan);background:#164e63}
.answer.correct{border:2px solid var(--green);background:rgba(20,83,45,.7)}
.answer.wrong{border:2px solid var(--red);background:rgba(127,29,29,.55)}
.feedback{display:none;margin:17px 0;padding:14px;border-radius:12px;line-height:1.5}
.feedback.show{display:block}.feedback.good{background:rgba(20,83,45,.35);border:1px solid rgba(74,222,128,.45)}
.feedback.bad{background:rgba(127,29,29,.3);border:1px solid rgba(248,113,113,.45)}
.quiz-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.result-panel{text-align:center}.result-score{font-size:48px;font-weight:950;color:var(--cyan);margin:10px}
.hidden{display:none!important}
footer{text-align:center;color:#8292a7;font-size:12px;padding:0 15px 35px}
@media(max-width:560px){header{padding-top:24px}.stage-card{min-height:175px}.card{padding:19px}.course-card{min-height:105px}.answers{grid-template-columns:1fr}.question{font-size:19px}}
</style>
</head>
<body>
<div class="top-progress" aria-label="Progreso de ejercicios">
  <div class="progress-line"><span class="progress-label">TU PROGRESO</span><span class="progress-number" id="progressText">0%</span></div>
  <div class="track"><div class="fill" id="progressFill"></div></div>
</div>
<header>
  <p class="logo">∑ MATES</p>
  <p class="tagline">Matemáticas paso a paso · Aprende, practica y mejora</p>
</header>
<main id="app" aria-live="polite"></main>
<footer>∑ MATES · Aprende a tu ritmo</footer>

<script>
const curriculum = {
  "Primaria": {
    "1.º de Primaria": ["Sumas","Restas","Geometría"],
    "2.º de Primaria": ["Sumas","Restas","Multiplicaciones","Geometría"],
    "3.º de Primaria": ["Sumas","Restas","Multiplicaciones","Divisiones","Fracciones"],
    "4.º de Primaria": ["Operaciones combinadas","Multiplicaciones","Divisiones","Fracciones","Decimales","Geometría"],
    "5.º de Primaria": ["Operaciones combinadas","Fracciones","Decimales","Porcentajes","Proporcionalidad","Geometría"],
    "6.º de Primaria": ["Operaciones combinadas","Fracciones","Decimales","Porcentajes","Proporcionalidad","Estadística","Geometría"]
  },
  "ESO": {
    "1.º de ESO": ["Números enteros","Fracciones","Decimales","Operaciones combinadas","Potencias","Proporcionalidad","Álgebra","Geometría","Estadística"],
    "2.º de ESO": ["Números enteros","Fracciones","Decimales","Potencias","Porcentajes","Proporcionalidad","Álgebra","Geometría","Estadística"],
    "3.º de ESO": ["Números enteros","Fracciones","Decimales","Potencias","Porcentajes","Proporcionalidad","Álgebra","Geometría","Estadística"],
    "4.º de ESO": ["Fracciones","Decimales","Potencias","Porcentajes","Proporcionalidad","Álgebra","Geometría","Estadística"]
  }
};

const topicInfo = {
  "Sumas": {icon:"➕", intro:"Sumar consiste en juntar dos o más cantidades para obtener un total.", formula:"25 + 17 = 42"},
  "Restas": {icon:"➖", intro:"Restar consiste en quitar una cantidad de otra o calcular la diferencia entre ambas.", formula:"50 − 18 = 32"},
  "Multiplicaciones": {icon:"✖️", intro:"Multiplicar es sumar una misma cantidad varias veces.", formula:"7 × 8 = 56"},
  "Divisiones": {icon:"➗", intro:"Dividir es repartir una cantidad en partes iguales o averiguar cuántas veces cabe una cantidad en otra.", formula:"56 ÷ 7 = 8"},
  "Números enteros": {icon:"🔢", intro:"Los números enteros incluyen los positivos, los negativos y el cero.", formula:"−3 + 7 = 4"},
  "Fracciones": {icon:"🍕", intro:"Una fracción representa una o varias partes iguales de una unidad. El numerador indica las partes que tomamos y el denominador las partes en que se divide la unidad.", formula:"1/4 + 2/4 = 3/4"},
  "Decimales": {icon:"🔹", intro:"Los números decimales tienen una parte entera y otra decimal, separadas por una coma.", formula:"2,5 + 1,25 = 3,75"},
  "Operaciones combinadas": {icon:"🧮", intro:"Para resolver varias operaciones juntas, respeta este orden: paréntesis; potencias y raíces; multiplicaciones y divisiones; sumas y restas.", formula:"8 + 3 × (5 − 2) = 17"},
  "Potencias": {icon:"⚡", intro:"Una potencia expresa una multiplicación repetida de factores iguales. La base es el número que se repite y el exponente indica cuántas veces.", formula:"2³ = 2 × 2 × 2 = 8"},
  "Porcentajes": {icon:"％", intro:"Un porcentaje expresa una proporción de cada cien. Para calcularlo, multiplica la cantidad por el porcentaje y divide entre cien.", formula:"20 % de 150 = 150 × 20 ÷ 100 = 30"},
  "Proporcionalidad": {icon:"⚖️", intro:"Dos magnitudes son directamente proporcionales cuando al multiplicar una por un número, la otra también se multiplica por ese mismo número.", formula:"2 kg cuestan 6 € → 5 kg cuestan 15 €"},
  "Álgebra": {icon:"𝒙", intro:"El álgebra utiliza letras para representar números desconocidos. Una ecuación es una igualdad que contiene una incógnita.", formula:"x + 5 = 12 → x = 7"},
  "Geometría": {icon:"📐", intro:"La geometría estudia las figuras, sus medidas y sus propiedades. El área mide la superficie y el perímetro mide el contorno.", formula:"Área del rectángulo = base × altura"},
  "Estadística": {icon:"📊", intro:"La estadística organiza y analiza datos. La media se obtiene sumando los datos y dividiendo entre su número.", formula:"Media de 2, 4 y 6 = (2 + 4 + 6) ÷ 3 = 4"}
};

// Las preguntas ya no están guardadas en este HTML: las genera la IA en el servidor cada día.

const app = document.getElementById('app');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
let selectedStage = null, selectedCourse = null, selectedTopic = null;
let questions = [], questionIndex = 0, chosenAnswer = null, score = 0, answered = 0, locked = false, dailyDateLabel = '';

function escapeHTML(value){return String(value).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));}
function setProgress(value){
  const safe = Math.max(0,Math.min(100,value));
  progressFill.style.width = safe + '%';
  progressText.textContent = Math.round(safe) + '%';
}
function resetProgress(){setProgress(0)}
function toolbar(crumb,back){return `<div class="toolbar"><span class="crumb">${crumb}</span><button class="back-btn" onclick="${back}">← Volver</button></div>`}

function showStages(){
  selectedStage=null;selectedCourse=null;selectedTopic=null;resetProgress();
  app.innerHTML=`<section class="screen">
    <p class="eyebrow">EMPIEZA A APRENDER</p><h1>Elige tu etapa</h1>
    <p class="subtitle">Selecciona tu etapa educativa para ver los cursos y todos sus temas de matemáticas.</p>
    <div class="grid">
      <button class="card stage-card" onclick="chooseStage('Primaria')"><div><div class="symbol">📘</div><h2>Primaria</h2><p>De 1.º a 6.º · Construye una buena base matemática.</p></div></button>
      <button class="card stage-card" onclick="chooseStage('ESO')"><div><div class="symbol">📐</div><h2>ESO</h2><p>De 1.º a 4.º · Avanza hacia las matemáticas más complejas.</p></div></button>
    </div></section>`;
}
function chooseStage(stage){selectedStage=stage;showCourses()}
function showCourses(){
  resetProgress();
  const courses=Object.keys(curriculum[selectedStage]);
  app.innerHTML=`<section class="screen">${toolbar('ETAPA: '+selectedStage,'showStages()')}
    <p class="eyebrow">${selectedStage==='Primaria'?'EDUCACIÓN PRIMARIA':'EDUCACIÓN SECUNDARIA'}</p>
    <h1>${selectedStage}</h1><p class="subtitle">Ahora elige el curso en el que quieres estudiar matemáticas.</p>
    <div class="grid">${courses.map((c,i)=>`<button class="card course-card" onclick="chooseCourse(${i})"><span class="course-number">${i+1}º</span><span><h3>${c}</h3><small>Ver temas de matemáticas →</small></span></button>`).join('')}</div>
  </section>`;
}
function chooseCourse(index){selectedCourse=Object.keys(curriculum[selectedStage])[index];showTopics()}
function showTopics(){
  resetProgress();const topics=curriculum[selectedStage][selectedCourse];
  app.innerHTML=`<section class="screen">${toolbar(selectedStage.toUpperCase()+' · '+selectedCourse,'showCourses()')}
    <p class="eyebrow">SELECCIÓN DE TEMAS</p><h1>${selectedCourse}</h1>
    <p class="subtitle">Escoge el tema que quieres aprender o practicar.</p>
    <div class="grid">${topics.map(t=>`<button class="card topic-card" onclick="chooseTopic('${t}')"><span class="topic-icon">${topicInfo[t]?.icon||'📘'}</span><h3>${t}</h3><small>Explicación y ejercicios →</small></button>`).join('')}</div>
  </section>`;
}
function chooseTopic(topic){selectedTopic=topic;showLesson()}
function showLesson(){
  resetProgress();questions=[];questionIndex=0;chosenAnswer=null;score=0;answered=0;locked=false;dailyDateLabel='';
  const info=topicInfo[selectedTopic];
  app.innerHTML=`<section class="screen">${toolbar(selectedCourse+' · '+selectedTopic,'showTopics()')}
    <p class="eyebrow">${selectedStage.toUpperCase()} · ${selectedCourse}</p><h1>${selectedTopic}</h1>
    <article class="lesson-panel"><h2>📖 Aprende</h2><div class="lesson-text"><p>${info.intro}</p><div class="formula">${info.formula}</div><p>Lee la explicación y observa el ejemplo. Cuando estés preparado, pulsa el botón para empezar los ejercicios.</p></div><button class="primary-btn" onclick="startQuiz()">Empezar ejercicios →</button></article>
    <div id="quizArea"></div>
  </section>`;
}
async function startQuiz(){
  const area=document.getElementById('quizArea');
  if(!area)return;
  area.innerHTML=`<section class="quiz-panel"><div class="loading-ai"><span class="loading-dot"></span><div><b>La IA está preparando tus preguntas de hoy...</b><br><small style="color:var(--muted)">Son diferentes cada día y están adaptadas a tu curso.</small></div></div></section>`;
  area.scrollIntoView({behavior:'smooth',block:'start'});
  const params=new URLSearchParams({stage:selectedStage,course:selectedCourse,topic:selectedTopic});
  try{
    const response=await fetch(`/.netlify/functions/daily-questions?${params.toString()}`,{cache:'no-store'});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'No se pudieron crear las preguntas.');
    if(!Array.isArray(data.questions)||data.questions.length===0)throw new Error('La IA no ha devuelto preguntas válidas.');
    questions=data.questions;
    dailyDateLabel=data.dateLabel||data.date||'';
    questionIndex=0;chosenAnswer=null;score=0;answered=0;locked=false;
    setProgress(0);
    renderQuestion();
  }catch(error){
    console.error('Error al cargar preguntas de IA:',error);
    area.innerHTML=`<section class="quiz-panel"><p class="eyebrow">NO SE HAN PODIDO CARGAR</p><h2>Conexión con la IA</h2><p class="error-note">No hemos podido generar las preguntas de hoy. Comprueba que la web está publicada en Netlify y que has configurado la variable <b>OPENAI_API_KEY</b>.</p><button class="primary-btn" onclick="startQuiz()">Volver a intentar ↻</button></section>`;
  }
}
function renderQuestion(){
  const q=questions[questionIndex];chosenAnswer=null;locked=false;
  document.getElementById('quizArea').innerHTML=`<section class="quiz-panel">
    <div class="quiz-heading"><h2>✏️ Practica</h2><span class="question-count">PREGUNTA ${questionIndex+1} DE ${questions.length}<span class="daily-badge">IA · ${escapeHTML(dailyDateLabel)}</span></span></div>
    <p class="question">${escapeHTML(q.q)}</p>
    <div class="answers">${q.a.map((a,i)=>`<button class="answer" id="answer${i}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${escapeHTML(a)}</button>`).join('')}</div>
    <div class="feedback" id="feedback"></div>
    <div class="quiz-actions"><button class="primary-btn" id="checkBtn" onclick="checkAnswer()" disabled>Comprobar respuesta</button><button class="primary-btn hidden" id="nextBtn" onclick="nextQuestion()">Siguiente →</button></div>
  </section>`;
}
function selectAnswer(index){
  if(locked)return;chosenAnswer=index;
  document.querySelectorAll('.answer').forEach((b,i)=>b.classList.toggle('selected',i===index));
  document.getElementById('checkBtn').disabled=false;
}
function checkAnswer(){
  if(chosenAnswer===null||locked)return;locked=true;answered++;
  const q=questions[questionIndex],good=chosenAnswer===q.c;
  if(good)score++;
  document.querySelectorAll('.answer').forEach((b,i)=>{
    b.disabled=true;if(i===q.c)b.classList.add('correct');else if(i===chosenAnswer)b.classList.add('wrong');
  });
  const feedback=document.getElementById('feedback');feedback.className='feedback show '+(good?'good':'bad');
  feedback.innerHTML=(good?'✅ ¡Correcto! ':'❌ No es correcto. ')+escapeHTML(q.e);
  setProgress((answered/questions.length)*100);
  document.getElementById('checkBtn').classList.add('hidden');
  const next=document.getElementById('nextBtn');next.classList.remove('hidden');
  next.textContent=questionIndex===questions.length-1?'Ver resultado':'Siguiente →';
}
function nextQuestion(){
  if(questionIndex<questions.length-1){questionIndex++;renderQuestion();}
  else showResult();
}
function showResult(){
  setProgress(100);
  const pct=Math.round(score/questions.length*100);
  document.getElementById('quizArea').innerHTML=`<section class="result-panel"><p class="eyebrow">EJERCICIOS COMPLETADOS</p><h2>¡Has terminado!</h2><div class="result-score">${score}/${questions.length}</div><p>Has acertado ${score} de ${questions.length} preguntas (${pct} %).</p><p class="subtitle">${pct===100?'¡Excelente! Has dominado este ejercicio.':pct>=66?'¡Buen trabajo! Sigue practicando para mejorar aún más.':'Vuelve a repasar la explicación y prueba otra vez. ¡Tú puedes!'}</p><div class="quiz-actions" style="justify-content:center"><button class="secondary-btn" onclick="showTopics()">Volver a los temas</button><button class="primary-btn" onclick="startQuiz()">Repetir ejercicios ↻</button></div></section>`;
}

showStages();
</script>
</body>
</html>
